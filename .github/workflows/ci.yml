name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The load-bearing job. Windows is the platform this project targets first: the Low-integrity
  # + Job Object sandbox suites and the Windows path-rule tests execute ONLY here, so this is the
  # run that can actually falsify the project's claims.
  windows:
    name: Windows · Node 22
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      # `npm ci` runs `prepare`, which builds dist/. The build must exist BEFORE the tests:
      # test/cli.smoke.test.ts spawns the real built CLI and skips itself when dist/ is absent,
      # so testing without building would report a green run that never exercised the binary.
      - name: Install (runs prepare → build)
        run: npm ci

      - name: Verify the build produced the CLI entry point
        shell: bash
        run: test -f dist/cli/index.js || (echo "dist/cli/index.js missing — the smoke suite would silently skip" && exit 1)

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        # AGENT_LIVE_TEST is deliberately never set: the opt-in live smokes (one per provider
        # whose key is set — Anthropic, OpenAI, DeepSeek, Kimi, GLM — see test/live-providers)
        # each make a real, billable API call. CI stays hermetic — no network, no keys.
        run: npm test

  # Advisory, and honestly labelled as such. The suite is Windows-first: a number of tests assert
  # Windows path and environment semantics directly (backslash traversal, UNC rejection,
  # case-insensitive child-env deduplication, taskkill-based tree kill). The RUNTIME behaves
  # correctly on Linux — it is those tests that encode win32 assumptions — so a red result here
  # means "not yet ported", not "broken on Linux". Porting them is tracked in ROADMAP.md's
  # deferred pool. This job is kept visible rather than deleted so the gap stays measurable.
  linux:
    name: Linux · Node 22 (advisory — suite not yet ported)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install (runs prepare → build)
        run: npm ci

      - name: Verify the build produced the CLI entry point
        run: test -f dist/cli/index.js || (echo "dist/cli/index.js missing" && exit 1)

      - name: Typecheck
        run: npm run typecheck

      - name: Test (advisory)
        run: npm test
