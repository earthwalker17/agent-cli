name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The load-bearing job. Windows is the platform this project targets first: the Low-integrity
  # + Job Object sandbox suites and the Windows path-rule tests execute ONLY here, so this is the
  # run that can actually falsify the project's claims.
  windows:
    name: Windows · Node 22
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      # `npm ci` runs `prepare`, which builds dist/. The build must exist BEFORE the tests:
      # test/cli.smoke.test.ts spawns the real built CLI and skips itself when dist/ is absent,
      # so testing without building would report a green run that never exercised the binary.
      - name: Install (runs prepare → build)
        run: npm ci

      # Scoped to what an installer of this project actually receives. `npm ci` prints a bare
      # "N vulnerabilities" summary that folds in the dev tree (vitest → vite → postcss and
      # friends), and that number is not a claim about this package — nothing dev-only ships.
      # This step is the claim: the RUNTIME dependency tree carries no high/critical advisory.
      # It is a lockfile-level fact, so it runs once, on the load-bearing platform.
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Verify the build produced the CLI entry point
        shell: bash
        run: test -f dist/cli/index.js || (echo "dist/cli/index.js missing — the smoke suite would silently skip" && exit 1)

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        # AGENT_LIVE_TEST is deliberately never set: the opt-in live smokes (one per provider
        # whose key is set — Anthropic, OpenAI, DeepSeek, Kimi, GLM — see test/live-providers)
        # each make a real, billable API call. CI stays hermetic — no network, no keys.
        run: npm test

  # The second real gate (S22.6). This job was advisory-red from 2026-07-28 until S22.6 on the
  # theory that "the suite is not yet ported"; measured, that was three assertions, not a suite.
  # They asserted Windows case-folding of paths and project ids — which `caseFold` deliberately
  # does NOT do on a case-sensitive filesystem — and they now pin both platforms' answers.
  #
  # What genuinely differs here is coverage, not correctness: the Windows-only suites SKIP on
  # Linux (30 skipped vs 11), because the Low-integrity/Job Object sandbox, taskkill tree-kill
  # and the win32 path rules have no counterpart to exercise. Windows therefore remains the
  # platform on which this project's sandbox claims can be falsified; Linux proves the rest of
  # the runtime is genuinely cross-platform rather than merely believed to be.
  linux:
    name: Linux · Node 22
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Install (runs prepare → build)
        run: npm ci

      - name: Verify the build produced the CLI entry point
        run: test -f dist/cli/index.js || (echo "dist/cli/index.js missing" && exit 1)

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
